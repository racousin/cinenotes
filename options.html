<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>CinéNotes – Options</title>
  <style>
    body { font: 14px system-ui, sans-serif; width: 320px; padding: 12px 16px; color: #222; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; }
    p.hint { color: #666; font-size: 12px; margin: 4px 0 12px; }
    button { padding: 6px 10px; margin-right: 6px; cursor: pointer; }
    #status { color: #1a7f37; font-size: 12px; margin-top: 8px; min-height: 1em; }
  </style>
</head>
<body>
  <h1>🎬 CinéNotes</h1>
  <button id="openRanking" style="width:100%;padding:9px;margin-bottom:12px;background:#e50914;color:#fff;border:0;border-radius:4px;font-weight:700">★ Ouvrir le classement</button>
  <p class="hint">AlloCiné et Rotten Tomatoes fonctionnent sans configuration.</p>
  <label for="omdbKey">Clé API OMDb (optionnelle)</label>
  <input id="omdbKey" placeholder="ex. a1b2c3d4" autocomplete="off" />
  <p class="hint">Pour afficher la note IMDb et Metacritic. Clé gratuite sur
    <a href="https://www.omdbapi.com/apikey.aspx" target="_blank">omdbapi.com</a>.</p>
  <button id="save">Enregistrer</button>
  <button id="clear">Vider le cache</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
